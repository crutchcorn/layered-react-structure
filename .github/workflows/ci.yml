name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, format, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint all packages
        run: pnpm run test:eslint

      - name: Check formatting
        run: pnpm run test:format

      - name: Validate skill eval configuration
        run: pnpm run test:evals
        env:
          PROMPTFOO_DISABLE_TELEMETRY: '1'

      - name: Build all packages with Nx
        run: pnpm run build

      - name: Typecheck source and tests with Nx
        run: pnpm run test:types

      - name: Run Vitest and packed-package consumer checks with Nx
        run: pnpm run test:lib
